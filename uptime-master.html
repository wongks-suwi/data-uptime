<title>Uptime Master</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar + tab nav; content is one full-width working surface per tab.
   Entry tab is a spreadsheet-style grid (same columns as the Excel Daily_Input), other tabs are reports. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E9EDF3; --ink:#142033; --ink2:#53627A; --line:#D3DAE5;
  --accent:#1E4FD6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --good:#12794A; --good-bg:#D9F2E5; --warn:#8F5A00; --warn-bg:#FBE9C5; --bad:#B3261E; --bad-bg:#F9D9D5;
  --in:#FFF6D1; --calc:#EDF0F5; --day:#C98400; --night:#4A3FB0;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#161F2A; --surface2:#1F2B39; --ink:#E6ECF4; --ink2:#9BABBE; --line:#2B3A4B;
  --accent:#7D9DFF; --accent-ink:#0B1220; --accent-soft:#1D2B4D;
  --good:#52C792; --good-bg:#12382A; --warn:#EDB955; --warn-bg:#3A2D0F; --bad:#FF8F85; --bad-bg:#44201D;
  --in:#2D2A14; --calc:#1D2733; --day:#E8B13F; --night:#A59BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#161F2A; --surface2:#1F2B39; --ink:#E6ECF4; --ink2:#9BABBE; --line:#2B3A4B;
  --accent:#7D9DFF; --accent-ink:#0B1220; --accent-soft:#1D2B4D;
  --good:#52C792; --good-bg:#12382A; --warn:#EDB955; --warn-bg:#3A2D0F; --bad:#FF8F85; --bad-bg:#44201D;
  --in:#2D2A14; --calc:#1D2733; --day:#E8B13F; --night:#A59BFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding-bottom:8px}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
.brand h1 small{font-weight:500;color:var(--ink2);font-size:13px;margin-left:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink2);background:var(--surface)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.chip.busy i{background:var(--warn)} .chip.err i{background:var(--bad)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{padding:9px 14px;text-decoration:none;color:var(--ink2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav a:hover{color:var(--ink)} nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding-top:18px;min-width:0}
h2{font-size:16px;margin:0 0 4px;font-weight:700} .sub{color:var(--ink2);margin:0 0 14px;max-width:72ch}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12px} .btn:focus-visible,input:focus-visible,select:focus-visible,nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.fld input,.fld select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;color:var(--ink);font-size:14px}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
table{border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;text-align:right}
th{background:var(--surface2);color:var(--ink2);font-weight:600;text-align:center;position:sticky;top:0;z-index:2;font-size:12px;white-space:pre-line;vertical-align:bottom}
td.l,th.l{text-align:left} td.c{text-align:center}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* entry grid */
#grid{min-width:max-content}
#grid td{padding:0;height:30px} #grid td.calc{background:var(--calc);padding:0 8px;font-family:var(--mono);font-variant-numeric:tabular-nums}
#grid input,#grid select{width:100%;height:30px;border:0;background:var(--in);padding:0 6px;border-radius:0;font-size:13px;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
#grid input[type=text],#grid select{font-family:var(--font);text-align:left}
#grid input:focus,#grid select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
#grid input::-webkit-outer-spin-button,#grid input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0} #grid input[type=number]{-moz-appearance:textfield;appearance:textfield}
#grid .stk{position:sticky;z-index:1;background:var(--surface)} #grid thead .stk{z-index:3;background:var(--surface2)}
#grid .k0{left:0;min-width:34px;text-align:center;color:var(--ink2)} #grid .k1{left:34px;min-width:58px} #grid .k2{left:92px;min-width:150px;box-shadow:2px 0 0 var(--line)}
#grid tr.s-D .k0{box-shadow:inset 4px 0 0 var(--day)} #grid tr.s-N .k0{box-shadow:inset 4px 0 0 var(--night)}
#grid .cc{width:58px;min-width:58px} #grid .cw{width:90px;min-width:90px} #grid .cm{width:200px;min-width:200px}
.good{color:var(--good);font-weight:600} .bad{color:var(--bad);font-weight:600}
td.gd{background:var(--good-bg)} td.bd{background:var(--bad-bg)}
tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:600;z-index:2}
.x{border:0;background:transparent;color:var(--ink2);cursor:pointer;padding:0 8px;height:30px} .x:hover{color:var(--bad)}
.hint{font-size:12px;color:var(--ink2);margin:8px 0 0}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
/* reports */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px} @media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-size:22px;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums} .tile span{font-size:12px;color:var(--ink2)}
.wk td.cell{min-width:66px;text-align:center;line-height:1.25;padding:3px 4px} .wk td.cell small{display:block;font-size:11px}
.wk td.cell.gd small{color:var(--good)} .wk td.cell.bd small{color:var(--bad)} .wk th.dn{background:var(--surface2)} .wk th.nn{color:var(--night)} .wk th.dd{color:var(--day)}
.hb{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 64px;gap:6px 10px;align-items:center;font-size:13px}
.track{position:relative;height:18px;background:var(--surface2);border-radius:3px} .track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.track i.gd{background:var(--good)} .track i.bd{background:var(--bad)} .track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7}
.par{display:grid;grid-template-columns:24px minmax(120px,240px) minmax(0,1fr) 70px 56px;gap:6px 10px;align-items:center;font-size:13px}
.par .track i{background:var(--accent)} .par .cut{grid-column:1/-1;border-top:2px dashed var(--bad);font-size:11px;color:var(--bad);padding-top:1px;line-height:1.2}
.heat td{text-align:center;min-width:42px;font-family:var(--mono);font-size:12px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--ink2);background:var(--surface)} .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:12px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:40;max-width:90vw}
.mtbl input,.mtbl select{border:1px solid var(--line);background:var(--in);padding:3px 6px;border-radius:4px;width:100%;font-size:13px} .mtbl td{padding:3px}
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;max-width:900px}
.sec{margin:26px 0 8px;font-size:14px;font-weight:700;color:var(--ink)}
@media(max-width:600px){#grid .k2{min-width:112px} #grid .k1{min-width:52px} #grid select{padding:0 2px;font-size:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="brand">
    <h1>Uptime Master<small>โรงงาน F3 · กรอกครั้งเดียว ดึงใช้ทุกรายงาน</small></h1>
    <span class="chip" id="sync"><i></i><span id="synct">กำลังเชื่อมต่อ…</span></span>
  </div>
  <nav id="nav" aria-label="เมนู"></nav>
</header>
<main id="view"></main>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- constants ---------- */
const TYPES=['Press','Welding','Multi-HYD','S-HYD','CNC','MCT','ETC'];
const CAUSES=[
 ['เปลี่ยนรุ่น','품목변경','Model change'],['ปรับเครื่อง','조정','Machine adjustment'],['เปลี่ยนแม่พิมพ์ที่เสียหาย','금형 파손 교환','Broken die replacement'],
 ['ซ่อมแม่พิมพ์','금형수리','Die repair'],['เปลี่ยนวัตถุดิบ','원재료 교환','Raw material change'],['รอแม่พิมพ์','금형 대기','Waiting for die'],
 ['รอวัตถุดิบ','원소재 대기','Waiting for material'],['รอพนักงาน','인원 대기','Waiting for operator'],['รอการตรวจสอบ','검사 대기','Waiting for inspection'],
 ['เครื่องจักรเสีย','설비고장','Machine breakdown'],['สลับกะการทำงาน','공회전','Shift change / idle'],['ถ่ายน้ำมันเครื่อง','오일 교환','Oil change'],
 ['ทำความสะอาดเครื่องจักร','기계 청소 필요 시','Machine cleaning'],['หยุดทำความสะอาด (5ส)','청소(정지시)','Cleaning stop (5S)'],['ของเสีย','불량','Defect / scrap'],['อื่น ๆ','기타','Other']];
const TABS=[['entry','กรอกข้อมูล'],['weekly','Uptime รายสัปดาห์'],['summary','สรุปผล'],['downtime','สาเหตุหยุด'],['machines','เครื่อง'],['settings','ตั้งค่า']];
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const DEF={month:'2026-11',target:0.75,op:10.5,eff:0.7,weeks:[[1,3],[4,10],[11,17],[18,24],[25,30]]};

/* ---------- state ---------- */
const S={set:JSON.parse(JSON.stringify(DEF)),machines:{},days:{},remote:new Set(),ready:{m:false,d:false,s:false},db:null,ver:0,pending:0,fail:null,offline:false};
let cache=null;
const E={date:null,shift:'',drafts:new Map(),pref:'D'};
const R={wkStart:null,basis:'t100',showAll:false,dtLine:'',dtFrom:'',dtTo:''};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function h(tag,a,...kids){const e=document.createElement(tag);
  if(a)for(const[k,v]of Object.entries(a)){if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;else if(k==='dataset')Object.assign(e.dataset,v);else e.setAttribute(k,v===true?'':v);}
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}return e;}
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};
const f0=n=>Math.round(n).toLocaleString('en-US');
const f1=n=>n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const pct=(v,d)=>v==null?'–':(v*100).toFixed(d==null?1:d)+'%';
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const dow=s=>new Date(s+'T00:00:00Z').getUTCDay();
const monday=s=>addDays(s,-((dow(s)+6)%7));
const dmy=s=>s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const dm=s=>s.slice(8,10)+'/'+s.slice(5,7);
const mEnd=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate();};
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const newId=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clsUp=v=>v==null?'':(v>=S.set.target?'gd':'bd');
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,3500);}
function machList(){return Object.entries(S.machines).map(([id,m])=>({id,...m})).sort((a,b)=>(num(a.ord)||1e6)-(num(b.ord)||1e6)||a.id.localeCompare(b.id));}
const mLabel=m=>m.id+(m.name?' · '+m.name:'');

/* ---------- calculation (same formulas as the Excel master) ---------- */
function calc(r,m){
  let dt=0;const c=r.c||[];for(let i=0;i<16;i++)dt+=num(c[i]);
  const std=num(r.std),inp=num(r.inp),ng=num(r.ng),ok=inp-ng;
  const ct=num(r.ct)>0?num(r.ct):num(m&&m.ct),load=num(m&&m.load),eff=(m&&num(m.eff)>0)?num(m.eff):S.set.eff;
  const wh=num(r.wh)>0?num(r.wh):std/60;
  const capa=ct>0?wh*3600*eff/(ct+load):0,t100=ct>0?S.set.op*3600/ct:0;
  return{dt,work:std-dt,ok,ng,ct,wh,capa,t100,upC:capa>0?ok/capa:null,upT:t100>0?ok/t100:null,ngp:(ok+ng)>0?ng/(ok+ng):null,active:inp>0||dt>0};
}
function all(){
  if(cache&&cache.v===S.ver)return cache.rows;
  const rows=[];
  for(const[date,d]of Object.entries(S.days))for(const[rid,r]of Object.entries(d.rows||{})){
    const m=S.machines[r.m];rows.push({date,rid,r,m,k:calc(r,m),line:m?m.line:'?',type:m?m.type:'?'});}
  cache={v:S.ver,rows};return rows;
}
const live=()=>all().filter(x=>x.k.active);

/* ---------- storage ---------- */
const queues=new Map();
function setSync(){const c=$('#sync'),t=$('#synct');c.className='chip'+(S.fail?' err':S.pending?' busy':'');
  t.textContent=S.offline?'ไม่ได้เชื่อมต่อ':S.fail?S.fail:S.pending?'กำลังบันทึก…':(S.ready.m&&S.ready.d)?'บันทึกแล้ว · ซิงก์สด':'กำลังโหลด…';}
function failMsg(e){const c=e&&e.code;
  if(c==='invalid_argument')return'บัญชีนี้แก้ข้อมูลไม่ได้ (ต้องเป็น Contributor ขึ้นไป)';
  if(c==='quota_exceeded')return'พื้นที่เก็บข้อมูลเต็ม';return'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';}
function enqueue(key,fn){
  S.pending++;setSync();
  const p=(queues.get(key)||Promise.resolve()).then(fn).then(()=>{S.fail=null;},e=>{S.fail=failMsg(e);toast(S.fail);}).then(()=>{S.pending--;setSync();});
  queues.set(key,p);}
function saveRows(date,rowsObj){
  const d=S.days[date]||(S.days[date]={rows:{}});Object.assign(d.rows,rowsObj);S.ver++;
  enqueue('days/'+date,async()=>{const ref=S.db.doc('days/'+date);
    if(S.remote.has(date))await ref.update({rows:rowsObj});else{await ref.set({rows:{...S.days[date].rows}});S.remote.add(date);}});}
function deleteRow(date,rid){
  const d=S.days[date];if(!d)return;delete d.rows[rid];S.ver++;
  enqueue('days/'+date,async()=>{await S.db.doc('days/'+date).set({rows:{...S.days[date].rows}});S.remote.add(date);});}
function saveMachine(id,obj){S.machines[id]=obj;S.ver++;enqueue('machines/'+id,()=>S.db.doc('machines/'+id).set(obj));}
function deleteMachine(id){delete S.machines[id];S.ver++;enqueue('machines/'+id,()=>S.db.doc('machines/'+id).delete());}
function saveSettings(){S.ver++;enqueue('settings/main',()=>S.db.doc('settings/main').set(S.set));}

let pendingRender=false;
function editing(){const a=document.activeElement;return a&&a.closest&&a.closest('#view')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);}
function schedule(){if(editing()){pendingRender=true;return;}pendingRender=false;requestAnimationFrame(render);}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!editing()){pendingRender=false;render();}},60));

async function init(){
  const timer=setTimeout(()=>{if(!(S.ready.m&&S.ready.d)){S.fail='ยังเชื่อมต่อไม่ได้';setSync();}},10000);
  try{S.db=window.claude?await window.claude.use('db'):null;}catch(e){S.db=null;}
  if(!S.db){S.offline=true;setSync();render();return;}
  const err=e=>{S.fail=failMsg(e);setSync();};
  S.db.collection('machines').onSnapshot(s=>{S.machines={};s.docs.forEach(d=>S.machines[d.id]=d.data());S.ready.m=true;S.ver++;setSync();schedule();},err);
  S.db.collection('days').onSnapshot(s=>{S.days={};S.remote=new Set();s.docs.forEach(d=>{S.days[d.id]={rows:{...((d.data()||{}).rows||{})}};S.remote.add(d.id);});S.ready.d=true;S.ver++;
    if(!E.date){const ks=Object.keys(S.days).sort();E.date=ks.length?ks[ks.length-1]:todayIso();}clearTimeout(timer);S.fail=null;setSync();schedule();},err);
  S.db.doc('settings/main').onSnapshot(s=>{if(s.exists)S.set={...DEF,...s.data()};S.ready.s=true;S.ver++;schedule();},err);
}

/* ---------- routing ---------- */
function tab(){const t=location.hash.slice(1);return TABS.some(x=>x[0]===t)?t:'entry';}
function render(){
  const t=tab();
  $('#nav').replaceChildren(...TABS.map(([k,l])=>h('a',{href:'#'+k,'aria-current':k===t?'page':null},l)));
  const root=$('#view');root.replaceChildren();
  if(S.offline)root.append(h('div',{class:'banner'},'เชื่อมต่อฐานข้อมูลไม่ได้ เปิดหน้านี้ผ่าน claude.ai แล้วเข้าสู่ระบบ ข้อมูลจึงจะบันทึกและแสดงได้'));

    h('div',{class:'tile'},h('b',{class:tot.up==null?'':(tot.up>=S.set.target?'good':'bad')},pct(tot.up)),h('span',null,'Uptime (OK ÷ CAPA) · เป้า '+pct(S.set.target,0))),
    h('div',{class:'tile'},h('b',null,f1(tot.dt/60)),h('span',null,'เวลาหยุดรวม (ชั่วโมง)')),

    h('p',{class:'hint'},'เส้นดำแนวตั้ง = เป้า '+pct(S.set.target,0)));

/* ---------- DOWNTIME (replaces 기계 정지 원인) ---------- */
function vDowntime(root){
  const rows=live();const ks=rows.map(x=>x.date).sort();
  if(!R.dtFrom)R.dtFrom=ks[0]||S.set.month+'-01';if(!R.dtTo)R.dtTo=ks[ks.length-1]||S.set.month+'-'+mEnd(S.set.month);
  const f=rows.filter(x=>x.date>=R.dtFrom&&x.date<=R.dtTo&&(!R.dtLine||x.line===R.dtLine));
  const tot=Array(16).fill(0);for(const x of f)(x.r.c||[]).forEach((v,i)=>tot[i]+=num(v));
  const sum=tot.reduce((a,b)=>a+b,0);
  root.append(h('h2',null,'สาเหตุการหยุดเครื่อง'),h('p',{class:'sub'},'แทนชีต 기계 정지 원인: Pareto ของ 16 สาเหตุ เวลาที่กรอกเป็นนาที แสดงผลเป็นชั่วโมง'));
  const lines=[...new Set(live().map(x=>x.line))].sort();
  root.append(h('div',{class:'bar'},
    h('label',{class:'fld'},'Line',h('select',{onchange:e=>{R.dtLine=e.target.value;render();},value:R.dtLine},h('option',{value:''},'ทั้งหมด'),...lines.map(l=>h('option',{value:l,selected:l===R.dtLine},l)))),
    h('label',{class:'fld'},'ตั้งแต่',h('input',{type:'date',value:R.dtFrom,onchange:e=>{R.dtFrom=e.target.value;render();}})),
    h('label',{class:'fld'},'ถึง',h('input',{type:'date',value:R.dtTo,onchange:e=>{R.dtTo=e.target.value;render();}}))));
  if(!sum){root.append(h('div',{class:'empty'},h('b','ไม่มีเวลาหยุดในช่วงนี้'),'ปรับช่วงวันที่หรือ Line'));return;}
  const ord=tot.map((v,i)=>({i,v})).sort((a,b)=>b.v-a.v||a.i-b.i).filter(x=>x.v>0);
  const mx=ord[0].v;let cum=0,cut=false;const parts=[];
  ord.forEach((x,n)=>{cum+=x.v;parts.push(h('div',{class:'num',style:'color:var(--ink2)'},String(n+1)),h('div',null,CAUSES[x.i][0],h('div',{style:'font-size:11px;color:var(--ink2)'},CAUSES[x.i][2])),
      h('div',{class:'track'},h('i',{style:'width:'+x.v/mx*100+'%'})),h('div',{class:'num'},f1(x.v/60)+' ชม.'),h('div',{class:'num',style:'color:var(--ink2)'},pct(cum/sum,0)));
    if(!cut&&cum/sum>=0.8&&n<ord.length-1){cut=true;parts.push(h('div',{class:'cut'},'ถึง 80% ของเวลาหยุดทั้งหมด · จุดที่ควรเริ่มแก้'));}});
  root.append(h('div',{class:'tiles'},h('div',{class:'tile'},h('b',null,f1(sum/60)),h('span',null,'ชั่วโมงหยุดรวม')),h('div',{class:'tile'},h('b',null,CAUSES[ord[0].i][0]),h('span',null,'สาเหตุอันดับ 1 · '+pct(ord[0].v/sum,0))),h('div',{class:'tile'},h('b',null,String(new Set(f.filter(x=>x.k.dt>0).map(x=>x.r.m)).size)),h('span',null,'เครื่องที่มีเวลาหยุด'))));
  root.append(h('div',{class:'sec'},'Pareto (เรียงจากมากไปน้อย · เปอร์เซ็นต์ท้ายแถว = สะสม)'),h('div',{class:'par'},parts));
  const mm=machList().map(m=>{const t=Array(16).fill(0);f.filter(x=>x.r.m===m.id).forEach(x=>(x.r.c||[]).forEach((v,i)=>t[i]+=num(v)));return{m,t,s:t.reduce((a,b)=>a+b,0)};}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const hmax=Math.max(...mm.flatMap(x=>x.t));
  root.append(h('div',{class:'sec'},'รายเครื่อง × สาเหตุ (ชั่วโมง)'),
    h('div',{class:'legend'},CAUSES.map((c,i)=>h('span',null,h('b',null,String(i+1)),' '+c[0]))),
    h('div',{class:'scroll heat',style:'max-height:60vh'},h('table',null,h('thead',null,h('tr',null,h('th',{class:'l'},'เครื่อง'),...CAUSES.map((c,i)=>h('th',{title:c[0]+' / '+c[2]},String(i+1))),h('th',null,'รวม'))),
      h('tbody',null,mm.map(x=>h('tr',null,h('td',{class:'l'},h('b',null,x.m.id)),...x.t.map(v=>h('td',{style:v?'background:color-mix(in srgb,var(--accent) '+Math.round(v/hmax*65)+'%,transparent)':''},v?f1(v/60):'')),h('td',{style:'font-weight:700'},f1(x.s/60))))))));
}

/* ---------- MACHINES ---------- */
const MF=[['id','Machine_ID',90,'text'],['line','Line',70,'line'],['type','Type',100,'type'],['plant','โรงงาน',60,'text'],['name','ชื่อแสดงผล',170,'text'],['ct','CT (วินาที)',70,'number'],['load','Loading (วินาที)',70,'number'],['eff','Efficiency (เว้นว่าง=ค่าตั้งต้น)',90,'number'],
  ['aDown','ชื่อในไฟล์ Downtime',150,'text'],['aUp','ชื่อในไฟล์ Uptime Show',150,'text'],['aProd','ชีตใน Productivity',150,'text'],['note','หมายเหตุ',160,'text']];
function vMachines(root){
  root.append(h('h2',null,'ทะเบียนเครื่อง'),h('p',{class:'sub'},'ที่เดียวที่ตั้งค่า CT ประเภท และชื่อที่เครื่องนี้ใช้ในไฟล์เดิมทั้ง 3 ไฟล์ (ตาราง mapping) เพิ่มเครื่องใหม่ที่นี่ แล้วเลือกใช้ในแท็บกรอกข้อมูล'));
  const ms=machList();const used=new Set(all().map(x=>x.r.m));
  const mk=(m,isNew)=>{const tr=h('tr',null);tr._id=m.id;
    MF.forEach(([k,l,w,t])=>{let inp;
      if(t==='line'){inp=h('select',{'data-k':k},h('option',{value:''},'—'),...['CNC','HYD'].map(v=>h('option',{value:v},v)));inp.value=m[k]||'';}
      else if(t==='type'){inp=h('select',{'data-k':k},h('option',{value:''},'—'),...TYPES.map(v=>h('option',{value:v},v)));inp.value=m[k]||'';}
      else inp=h('input',{'data-k':k,type:t==='number'?'number':'text',step:'any',min:'0',value:m[k]==null||m[k]===0&&t==='number'?'':String(m[k]),disabled:k==='id'&&!isNew,'aria-label':l});
      tr.append(h('td',{style:'min-width:'+w+'px'},inp));});
    tr.append(h('td',{class:'c'},isNew?h('button',{class:'btn sm pri',type:'button','data-a':'add'},'เพิ่ม'):h('button',{class:'x',type:'button','data-a':'del',title:used.has(m.id)?'มีข้อมูลที่ใช้เครื่องนี้อยู่':'ลบ'},'✕')));
    return tr;};
  const readM=tr=>{const o={};MF.forEach(([k,,,t])=>{if(k==='id')return;const v=tr.querySelector('[data-k="'+k+'"]').value.trim();o[k]=t==='number'?num(v):v;});return o;};
  const nrow=mk({},true);
  const tb=h('tbody',null,nrow,...ms.map(m=>mk(m,false)));
  tb.addEventListener('change',e=>{const tr=e.target.closest('tr');if(!tr||!tr._id)return;const old=S.machines[tr._id]||{};saveMachine(tr._id,{...old,...readM(tr)});});
  tb.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const tr=b.closest('tr');
    if(b.dataset.a==='add'){const id=tr.querySelector('[data-k="id"]').value.trim();
      if(!/^[A-Za-z0-9_\-.~:@+]{1,60}$/.test(id)){toast('Machine_ID ใช้ได้เฉพาะตัวอักษรอังกฤษ ตัวเลข และ - _ . (ไม่มีเว้นวรรค)');return;}
      if(S.machines[id]){toast('มี Machine_ID นี้แล้ว');return;}
      const o=readM(tr);o.ord=Math.max(0,...ms.map(m=>num(m.ord)))+1;saveMachine(id,o);render();return;}
    if(b.dataset.a==='del'){if(used.has(tr._id)){toast('ลบไม่ได้ เพราะมีข้อมูลที่ใช้เครื่องนี้อยู่');return;}
      if(b.dataset.armed){deleteMachine(tr._id);render();return;}b.dataset.armed='1';b.textContent='ลบ?';b.style.color='var(--bad)';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='✕';b.style.color='';}},3000);}});
  root.append(h('div',{class:'scroll mtbl',style:'max-height:70vh'},h('table',null,h('thead',null,h('tr',null,[...MF.map(f=>h('th',null,f[1])),h('th',null,'')])),tb)),
    h('p',{class:'hint'},'แถวบนสุดสำหรับเพิ่มเครื่องใหม่ · แก้ไขแล้วบันทึกอัตโนมัติเมื่อออกจากช่อง · Type ใช้จัดกลุ่มในแท็บสรุปผล'));
}

      h('input',{type:'number',min:'1',max:'31',value:String(w[1]),style:'width:70px',onchange:commit(v=>{S.set.weeks[i]=[S.set.weeks[i][0],num(v)];})}))))));
  root.append(h('div',{class:'sec'},'สาเหตุการหยุดเครื่อง 16 ข้อ (ตามหัวตารางเดิม)'),
    h('div',{class:'legend',style:'max-width:900px'},CAUSES.map((c,i)=>h('span',null,h('b',null,String(i+1)+'.'),' '+c[0]+' / '+c[1]+' / '+c[2]))));
}
